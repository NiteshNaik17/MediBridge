<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Medical Documents - MediBridge AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/index.html" class="logo" style="font-size: 1.2rem;">
          <i class="fa-solid fa-heart-pulse"></i>
          <span>MediBridge <span style="color: var(--accent-green)">AI</span></span>
        </a>
      </div>

      <ul class="sidebar-menu">
        <li class="sidebar-item"><a href="/patient/dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
        <li class="sidebar-item"><a href="/patient/profile.html"><i class="fa-solid fa-user-doctor"></i> Health Profile</a></li>
        <li class="sidebar-item"><a href="/patient/timeline.html"><i class="fa-solid fa-timeline"></i> Medical Timeline</a></li>
        <li class="sidebar-item active"><a href="/patient/upload.html"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Reports</a></li>
        <li class="sidebar-item"><a href="/patient/emergency.html"><i class="fa-solid fa-truck-medical"></i> Emergency Card</a></li>
      </ul>

      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-outline btn-sm" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="top-header">
        <div>
          <h1>AI Document Scanner & Upload</h1>
          <p class="text-muted">Upload prescriptions, PDF reports, or diagnostic lab papers</p>
        </div>
      </div>

      <div class="card">
        <div class="dropzone" id="document-dropzone" onclick="document.getElementById('patient-file-input').click()">
          <i class="fa-solid fa-cloud-arrow-up dropzone-icon"></i>
          <h3>Click or Drag & Drop Medical Report File Here</h3>
          <p class="text-muted" style="font-size: 0.9rem; margin-top: 6px;">Supports PDF, PNG, JPG, JPEG, TXT (Max 16MB)</p>
          <input type="file" id="patient-file-input" style="display: none;" accept=".pdf,.png,.jpg,.jpeg,.txt" onchange="handlePatientFileUpload()">
        </div>

        <!-- AI Extraction Live Results -->
        <div id="patient-ocr-results" style="display: none; margin-top: 2rem;"></div>
      </div>
    </main>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/patient.js"></script>
  <script>
    async function handlePatientFileUpload() {
      const fileInput = document.getElementById('patient-file-input');
      const resultsContainer = document.getElementById('patient-ocr-results');

      if (!fileInput.files[0]) return;

      const activePatientId = getLoggedInPatientId();

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('patient_id', activePatientId);
      formData.append('auto_save', 'true');

      resultsContainer.style.display = 'block';
      resultsContainer.innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Processing document with MediBridge AI OCR Engine...</p>';

      try {
        const res = await fetch('/api/ai/extract-doc', {
          method: 'POST',
          body: formData
        });
        const result = await res.json();

        if (result.success && result.data) {
          const d = result.data;
          showToast('Medical record analyzed and saved to your health timeline!', 'success');
          resultsContainer.innerHTML = `
            <div class="ai-banner">
              <h3><i class="fa-solid fa-circle-check"></i> Document Scanned & Saved to Your Health Timeline</h3>
              <div class="ai-banner-content">
                <p><strong>Extracted Diagnosis:</strong> ${d.diagnosis}</p>
                <p><strong>Detected Doctor:</strong> ${d.doctor_name}</p>
                <p><strong>Prescribed Medications:</strong> ${d.medicines.join(', ')}</p>
                <p><strong>Report Date:</strong> ${d.date}</p>
                <div style="margin-top: 1rem;">
                  <a href="/patient/timeline.html" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-timeline"></i> View Updated Medical Timeline
                  </a>
                </div>
              </div>
            </div>
          `;
        } else {
          showToast(result.message || 'Scanning failed.', 'error');
        }
      } catch (err) {
        showToast('Document extraction error.', 'error');
      }
    }
  </script>
</body>
</html>
